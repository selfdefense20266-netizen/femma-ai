kind = "mobile"
previewPath = "/"
title = "Femma AI"
description = "UNSTOPPABLE is a women-first fitness, wellness, nutrition, cycle health, pregnancy, confidence, and personal-safety platform. It guides users on a unified transformation journey from beginner to confident and unstoppable, combining workouts, yoga, self-defense, food scanning, meal planning, cycle tracking, and gamified progress all in one premium mobile app."
version = "1.0.0"
id = "artifacts/unstoppable"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21275

[services.development]
run = "pnpm --filter @workspace/unstoppable run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/unstoppable", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/unstoppable", "run", "serve" ]

[services.env]
PORT = "21275"
BASE_PATH = "/"
